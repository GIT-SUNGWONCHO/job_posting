# 시험: 매칭 방식 A(지금)·B(항목 풀)·C(고정 틀)·D(AI 바로 점수)·E(임베딩 유사도)를 내 평가(○△×)로 견준다. 로그에는 건수·지표만.
# score: 기준 샘플 전부를 방식마다 2번 매겨 비공개 저장소(trials/methods.json.gz)에 둔다(공고당 방식 하나에 AI 1번, E는 묶어서 몇 번).
# evaluate: 평가가 모인 뒤 저장한 점수와 맞대 지표만 낸다(AI 없음, 몇 분).
# 수동 실행: GitHub > Actions > method-compare > Run workflow
name: method-compare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: score = 기준 샘플 전부를 미리 매겨 비공개 저장소에(AI 부름) / evaluate = 저장한 점수와 평가로 지표만(AI 없음)
        required: true
        default: evaluate
        type: choice
        options: [evaluate, score]
      methods:
        description: score에서 새로 매길 방식(B·C·D·E 중)
        required: false
        default: "BCDE"
      rounds:
        description: score에서 방식마다 몇 번(흔들림을 보려고 2)
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - name: data 브랜치 연결
        run: |
          git fetch --depth=1 origin data
          git worktree add -B data data origin/data
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --locked --no-dev
      - name: 시험
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          MODE: ${{ inputs.mode }}
          METHODS: ${{ inputs.methods }}
          ROUNDS: ${{ inputs.rounds }}
        run: uv run --no-dev jobpost method-compare --data-dir data --mode "${MODE:-evaluate}" --methods "${METHODS:-BCDE}" --rounds "${ROUNDS:-2}" | tee -a "$GITHUB_STEP_SUMMARY"
