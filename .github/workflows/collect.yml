# 매일 새벽 공고를 수집해 data 브랜치에 쌓고, 회사 기본정보(DART)를 받고, 화면용 파일을 만들어 Supabase 저장소에 올리고,
# 매칭한 뒤 아침 알림을 보낸다.
# 수동 실행: GitHub > Actions > collect > Run workflow
name: collect

on:
  schedule:
    # GitHub 예약 실행은 늦게 시작되거나(2~4시간) 빠지기도 한다(2026-11-03 빠짐). 02:17에 걸고,
    # 05:47에 한 번 더 걸어 그날 수집이 아직 없을 때만 돈다(아래 check)
    - cron: "17 17 * * *"  # 매일 02:17 KST
    - cron: "47 20 * * *"  # 05:47 KST 예비

  workflow_dispatch:
    inputs:
      detail_budget:
        description: 직행·사람인·원티드·잡코리아 상세(본문)를 수집처마다 받을 최대 건수(비우면 설정값)
        required: false
      sources:
        description: 이 수집처만 받기(쉼표로, 예 jobkorea). 비우면 켜 둔 수집처 전부
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # 예약 실행이면 오늘 수집 기록(data 브랜치 runs/오늘.json)이 이미 있는지 본다. 있으면 건너뛴다(늦게 시작된 예약·예비 예약)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - id: today
        env:
          TZ: Asia/Seoul
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "done=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/$REPO/data/runs/$(date +%F).json")
          echo "오늘 수집 기록: $code"
          if [ "$code" = "200" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: check
    if: ${{ needs.check.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul  # 수집 날짜를 한국 날짜로 남긴다
    steps:
      - uses: actions/checkout@v4

      - name: data 브랜치 연결
        run: |
          git fetch --depth=1 origin data
          git worktree add -B data data origin/data

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked --no-dev

      - name: 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          args=(--data-dir data)
          if [ -n "${{ github.event.inputs.detail_budget }}" ]; then
            args+=(--detail-budget "${{ github.event.inputs.detail_budget }}")
          fi
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            args+=(--sources "${{ github.event.inputs.sources }}")
          fi
          uv run jobpost collect "${args[@]}" | tee run.json

      - name: 본문 읽기(이미지뿐인 후보 공고의 글자, AI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: uv run jobpost bodyread --data-dir data

      - name: 공고 정리(후보 공고의 매칭 항목, AI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: uv run jobpost facts --data-dir data

      - name: DART 고유번호 파일 캐시(받는 데 4분쯤 걸려 7일 동안 다시 쓴다)
        uses: actions/cache@v4
        with:
          path: .cache/dart
          key: dart-corpcode-${{ github.run_id }}
          restore-keys: dart-corpcode-

      - name: 회사 기본정보(DART)
        continue-on-error: true  # DART가 막힌 날에도 화면용 파일·매칭·알림은 계속한다
        shell: bash  # pipefail: 실패하면 | tee에 가려지지 않고 경고로 보인다(continue-on-error라 다음 단계는 계속)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CACHE: .cache/dart
        run: uv run jobpost dart --data-dir data | tee dart.json

      - name: 화면용 파일 만들기·올리기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run jobpost screen --data-dir data --out screen.json.gz --upload

      - name: 내 리서치 노트(data 브랜치 notes/를 사람마다 Supabase에)
        if: ${{ !cancelled() }}
        continue-on-error: true  # 노트가 깨져도 매칭·알림은 계속
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run jobpost notes --data-dir data

      - name: 매칭(후보 공고를 AI가 항목별로 매김)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: uv run jobpost match --data-dir data

      - name: 아침 알림
        if: ${{ !cancelled() }}  # 매칭이 실패해도 새 공고는 알린다
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run jobpost notify --data-dir data

      - name: 실행 요약
        if: always()
        run: |
          echo '### 수집 요약' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat run.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### 회사 기본정보(DART)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dart.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: data 브랜치에 커밋
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -q -m "collect $(date +%F)"
          for i in 1 2 3; do git push origin data && break; sleep $((i * 10)); done
