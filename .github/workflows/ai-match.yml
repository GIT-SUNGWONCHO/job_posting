# 시험: 필터 통과 공고 전부를 AI와 규칙으로 매겨 로그에 나란히 낸다. 매칭 계산법을 정할 때만 돌린다.
# 결과는 Supabase에 쓰지 않는다. 공고 수만큼 AI를 부르므로(약 300번, 20~30분) 자주 돌리지 않는다.
# 수동 실행: GitHub > Actions > ai-match > Run workflow
name: ai-match

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect  # 수집·매칭과 겹치지 않게
  cancel-in-progress: false

jobs:
  ai-match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: data 브랜치 연결
        run: |
          git fetch --depth=1 origin data
          git worktree add data origin/data

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked --no-dev

      - name: AI 매칭 시험
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --no-dev jobpost ai-match --data-dir data
