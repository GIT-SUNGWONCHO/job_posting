# 회사 리서치 심층분석 설정. 코드는 src/jobpost/research.py, 기준과 이유는 docs/content-rules.md "회사 리서치 모듈".

# 경쟁사: DART 업종 코드(기업개황 induty_code)가 같은 회사 중 최근 매출이 큰 순으로 몇 곳.
# 코드 길이가 회사마다 달라(612, 61220) 한쪽이 다른 쪽으로 시작하면 같은 업종으로 본다. 단 짧은 쪽이 min_code자리 이상일 때만.
# 이 앱이 DART 기본정보를 받은 회사(공고 회사 + 주요 기업) 안에서만 찾는다.
competitors: 2
min_code: 3

# 직무 환경·도구: 그 회사 공고 본문(열린 공고와 지난 공고, 헤드헌터 공고 제외)에서 찾은 도구.
# 스킬 사전(config/skills.yaml)과 따로 둔다. 사전은 매칭용이라 비슷한 도구·개념을 묶지만(Redash → Superset, 컨테이너 → Docker),
# 이 칸은 공고에 적힌 제품 이름 그대로 보여준다. 이름마다 찾을 말: 영문은 단어 경계로 찾고 세 글자 이하는 대소문자까지 맞춘다.
# 다른 뜻으로 많이 쓰이는 말은 넣지 않는다(EMR 전자의무기록, S3, Glue, Synapse, Dataflow, 스파크플러스).
# 칸마다 공고에 많이 나온 순으로 max_per_slot개까지.
max_per_slot: 6
tools:
  클라우드:
    AWS: [AWS, Amazon Web Services, 아마존 웹 서비스]
    GCP: [GCP, Google Cloud, 구글 클라우드]
    Azure: [Azure]
    Kubernetes: [Kubernetes, K8s, 쿠버네티스]
    Docker: [Docker, 도커]
    Terraform: [Terraform, 테라폼]
  데이터 플랫폼:
    Spark: [Spark, PySpark]
    Kafka: [Kafka, 카프카]
    Flink: [Flink]
    Airflow: [Airflow, 에어플로우]
    dbt: [dbt]
    Hadoop: [Hadoop, HDFS, 하둡]
    Hive: [Hive]
    Databricks: [Databricks, 데이터브릭스]
    Snowflake: [Snowflake]
    BigQuery: [BigQuery, 빅쿼리]
    Redshift: [Redshift]
    Trino: [Trino]
    PostgreSQL: [PostgreSQL, Postgres]
    MySQL: [MySQL]
    MariaDB: [MariaDB]
    Oracle: [Oracle, 오라클]
    Elasticsearch: [Elasticsearch, 엘라스틱서치]
    OpenSearch: [OpenSearch]
  BI:
    Tableau: [Tableau, 태블로]
    Power BI: [Power BI, PowerBI]
    Looker: [Looker]
    Superset: [Superset]
    Redash: [Redash]
    Metabase: [Metabase]
  AI 도구:
    PyTorch: [PyTorch, 파이토치]
    TensorFlow: [TensorFlow, 텐서플로]
    LangChain: [LangChain, 랭체인]
    LangGraph: [LangGraph]
    LlamaIndex: [LlamaIndex]
    Hugging Face: [Hugging Face, HuggingFace]
    vLLM: [vLLM]
    MLflow: [MLflow]
    Kubeflow: [Kubeflow]

# 이 말이 본문에 있으면 그 도구로 세지 않는다(같은 약자를 다른 뜻으로 쓰는 공고). GCP = 임상시험 관리기준(Good Clinical Practice)
unless:
  GCP: [임상, Good Clinical]
