# 스킬 사전: 공고 본문과 프로필에서 같은 스킬을 같은 이름으로 세기 위한 목록.
# 고정 기준이라 버전으로 관리한다. 바꾸면 version을 올리고 점수를 다시 계산한다.
# aliases: 본문에서 찾을 표기. 영문은 단어 경계로 찾고, 3글자 이하 영문은 대소문자까지 맞아야 한다.
# 한글은 그대로 찾는다. name도 찾는다.

version: 1

# 서로 바꿔 쓸 수 있는 스킬 묶음. 공고가 이 중 여러 개를 적어도 하나로 세고, 내가 하나라도 있으면 맞는 것으로 본다
# (예: "AWS, GCP, Azure 중 하나" 경험)
interchangeable:
  - [AWS, GCP, Azure]
  - [Tableau, Power BI, Looker, Superset]
  - [Databricks, Snowflake, BigQuery, Redshift]
  - [PostgreSQL, MySQL, Oracle]
  - [PyTorch, TensorFlow]
  - [Java, Scala, Golang, TypeScript]

groups:
  언어:
    - {name: Python, aliases: [파이썬]}
    - {name: SQL, aliases: [쿼리 작성]}
