# 대기업 그룹 이름 규칙(화면에 "삼성 계열"처럼 표시하고, 공고가 없어도 회사 목록에 두는 주요 기업을 고르는 데 쓴다)
#
# 원래 기준은 공정위 공시대상기업집단 소속회사 목록(2026.05 지정, 102개 집단)이다.
# 공정위 기업집단포털(egroup.go.kr)이 해외 IP를 막아서 아직 받지 못했다.
# 지금은 두 곳에 이름 규칙을 쓴다.
#   1) 수집처가 "대기업"으로 표시한 회사의 그룹 이름
#   2) 주요 기업: DART 상장사 목록(data 브랜치 dart/listed.json)에서 이 규칙에 맞는 회사(아래 major)
# 공정위 목록을 받으면 이 파일을 소속회사 이름 목록으로 바꾼다.
# 위에서부터 처음 맞는 그룹을 쓴다(HDC가 HD현대보다, KT&G가 KT보다 먼저).

groups:
  삼성: ["^삼성(?!제약|출판|공조|기계|정밀화학|수산)", "^에스원$", "^제일기획$", "^호텔신라$", "^멀티캠퍼스$"]
  SK: ["^SK", "^에스케이", "^11번가$"]
  현대자동차: ["^현대자동차", "^기아", "^현대모비스", "^현대오토에버", "^현대글로비스", "^현대제철", "^현대건설", "^현대엔지니어링", "^현대위아", "^현대트랜시스", "^현대캐피탈", "^현대카드", "^현대로템", "^현대차증권", "^현대비앤지스틸", "^포티투닷", "^이노션"]
  LG: ["^LG", "^엘지"]
  LX: ["^LX", "^엘엑스"]
  롯데: ["^롯데(?!카드)"]  # 롯데카드는 2019년 매각돼 롯데 소속이 아니다
  한화: ["^한화"]
  HDC: ["^HDC", "^에이치디씨"]
  HD현대: ["^HD", "^에이치디"]
  GS: ["^GS", "^지에스"]
  신세계: ["^신세계", "^이마트", "^SSG", "^에스에스지"]
  CJ: ["^CJ", "^씨제이", "^티빙", "^TVING"]
  한진: ["^한진", "^대한항공", "^진에어", "^아시아나", "^에어부산"]
  카카오: ["^카카오", "^디케이테크인"]
  LS: ["^LS", "^엘에스"]
  두산: ["^두산"]
  네이버: ["^네이버", "^NAVER", "^스노우$", "^라인"]
  KT&G: ["^KT&G", "^케이티앤지"]
  KT: ["^[Kk][Tt]", "^케이티", "^BC카드", "^비씨카드"]
  포스코: ["^포스코", "^POSCO"]
  농협: ["^NH(?!N)", "^엔에이치(농협|투자)", "^농협"]
  현대백화점: ["^현대백화점", "^현대그린푸드", "^현대리바트", "^현대홈쇼핑", "^현대IT&E"]
  HL: ["^HL", "^에이치엘"]
  미래에셋: ["^미래에셋"]
  효성: ["^효성"]
  코오롱: ["^코오롱"]
  KCC: ["^KCC", "^케이씨씨"]
  아모레퍼시픽: ["^아모레"]
  셀트리온: ["^셀트리온"]
  넷마블: ["^넷마블"]
  크래프톤: ["^크래프톤"]
  엔씨소프트: ["^엔씨소프트", "^NC"]
  토스: ["^비바리퍼블리카", "^토스"]
  쿠팡: ["^쿠팡"]
  우아한형제들: ["^우아한형제들"]
  하이브: ["^하이브", "^HYBE"]
  KB금융: ["^KB", "^케이비", "^국민은행"]
  신한금융: ["^신한"]
  하나금융: ["^하나"]
  우리금융: ["^우리은행", "^우리카드", "^우리금융"]
  교보생명: ["^교보"]
  메리츠: ["^메리츠"]
  한국투자금융: ["^한국금융지주", "^한국투자"]
  다우키움: ["^키움", "^다우기술", "^다우데이타"]
  DB: ["^DB"]
  DL: ["^DL", "^디엘"]
  iM금융: ["^iM", "^아이엠(뱅크|증권|캐피탈|라이프)", "^DGB", "^대구은행"]
  NHN: ["^NHN", "^엔에이치엔"]
  에코프로: ["^에코프로"]
  영풍: ["^영풍$", "^고려아연"]
  한국앤컴퍼니: ["^한국앤컴퍼니", "^한국타이어"]
  애경: ["^애경", "^제주항공", "^AK홀딩스"]
  중흥: ["^대우건설"]
  하림: ["^하림", "^팬오션"]
  삼양: ["^삼양"]
  오리온: ["^오리온"]
  한국콜마: ["^한국콜마", "^콜마"]
  이랜드: ["^이랜드"]
  OCI: ["^OCI"]
  태광: ["^태광", "^흥국"]
  동원: ["^동원"]
  BGF: ["^BGF"]
  SM: ["^SM"]

# 그룹 이름 규칙에는 맞지만 그 그룹이 아닌 회사(이름만 같다). 위 규칙보다 먼저 본다.
# 2026-10-23 DART 상장사 목록에서 규칙에 맞는 326곳을 보고 골랐다. 확실하지 않은 곳도 뺐다(잘못 묶는 것보다 낫다).
not_members:
  - "^(SK|에스케이)증권"  # 2018년 SK에서 떨어져 나갔다
  - "^SKAI$"
  - "^(SK|에스케이)렌터카"  # 2025년 매각
  - "^(SK|에스케이)스페셜티"  # 2025년 한앤컴퍼니에 매각(확실하지 않음)
  - "^LSK"
  - "^HLB"             # HL(옛 한라)과 다른 회사
  - "^에이치엘비"
  - "^에이치엘사이언스"
  - "^에이치엘지노믹스"
  - "^롯데관광개발"
  - "^롯데손해보험"    # 2019년 매각
  - "^하나투어"
  - "^하나마이크론"
  - "^하나머티리얼즈"
  - "^하나기술"
  - "^하나제약"
  - "^삼양(식품|라운드스퀘어)"  # 삼양홀딩스와 다른 그룹(삼양식품과 그 지주사)
  - "^삼양컴텍"
  - "^삼양엔텍"
  - "^GST"
  - "^(GSE|지에스이)$"
  - "^지에스엘$"        # 식품 회사, GS와 이어지는 근거를 찾지 못함
  - "^지에스엔텍"
  - "^KBG$"
  - "^KBI"
  - "^케이비아이"       # KBI동국실업
  - "^케이비물산"
  - "^KB오토시스"
  - "^동원개발"
  - "^동원수산"
  - "^동원(모빌리티|금속)"  # 옛 동원금속(종목 018500), 동원그룹과 다른 회사
  - "^한진중공업"
  - "^한진피앤씨"
  - "^신한$"
  - "^신한SIT"
  - "^태광$"            # 배관 부품 회사(태광그룹은 태광산업·흥국화재 등)
  - "^태광이엔시"
  - "^흥국$"
  - "^흥국에프엔비"
  - "^효성오앤비"
  - "^SM ?C&C"          # SM엔터테인먼트 계열(SM그룹과 다르다)
  - "^SM ?Life"
  - "^iMBC"             # MBC 계열
  - "^영풍산업"

# 주요 기업: 데이터·AI 공고가 없어도 회사 목록에 두고 회사 정보(DART)를 채워 두는 회사.
# 공고가 들어온 대기업·공기업·외국계에 더해, DART 상장사와 사업보고서를 낸 비상장 회사(회사채를 낸 큰 비상장사 등) 중
# 위 그룹 규칙에 맞는 곳(대기업)과 extra에 적은 곳.
# 상장 폐지된 곳은 DART 기업개황(corp_cls)으로 거른다(종목코드는 폐지 뒤에도 남는다).
major:
  # DART 이름에 이 말이 있으면 회사로 보지 않는다(스팩, 리츠, 펀드). 메리츠가 걸리지 않게 리츠는 이름 끝만
  skip: "스팩|기업인수목적|리츠$|투자회사|펀드|혼합형|유한공사|해외자원개발|투융자|발해인프라|유동화|피에프브이|PFV|에스피씨|SPC|제[0-9]+차$|제[일이삼사오육칠팔구십]+차$"
  # 그룹 규칙에 없지만 넣는 상장사. DART 이름 그대로(data 브랜치 dart/listed.json)
  extra:
    공기업·공공기관: [한국전력공사, 한국가스공사, 지역난방공사, 강원랜드, 한전KPS, 한전기술, 기업은행]
