# 대기업 그룹 이름 규칙(화면에 "삼성 계열"처럼 표시하는 데 쓴다)
#
# 원래 기준은 공정위 공시대상기업집단 소속회사 목록(2026.05 지정, 102개 집단)이다.
# 공정위 기업집단포털(egroup.go.kr)이 해외 IP를 막아서 아직 받지 못했다.
# 지금은 수집처가 "대기업"으로 표시한 회사에만 아래 이름 규칙을 적용한다.
# 공정위 목록을 받으면 이 파일을 소속회사 이름 목록으로 바꾼다.

groups:
  삼성: ["^삼성(?!제약|출판|공조|기계|정밀화학)", "^에스원$", "^제일기획$", "^호텔신라$", "^멀티캠퍼스$"]
  SK: ["^SK", "^에스케이", "^11번가$"]
  현대자동차: ["^현대자동차", "^기아", "^현대모비스", "^현대오토에버", "^현대글로비스", "^현대제철", "^현대건설", "^현대엔지니어링", "^현대위아", "^현대트랜시스", "^현대캐피탈", "^현대카드", "^현대로템", "^포티투닷", "^이노션"]
  LG: ["^LG", "^엘지"]
  롯데: ["^롯데"]
  한화: ["^한화"]
  HD현대: ["^HD", "^에이치디"]
  GS: ["^GS", "^지에스"]
  신세계: ["^신세계", "^이마트", "^SSG", "^에스에스지"]
  CJ: ["^CJ", "^씨제이", "^티빙", "^TVING"]
  한진: ["^한진", "^대한항공", "^진에어"]
  카카오: ["^카카오", "^디케이테크인"]
  LS: ["^LS", "^엘에스"]
  두산: ["^두산"]
  네이버: ["^네이버", "^NAVER", "^스노우$", "^라인"]
  KT: ["^[Kk][Tt]", "^케이티", "^BC카드", "^비씨카드"]
  포스코: ["^포스코", "^POSCO"]
  농협: ["^NH(?!N)", "^농협"]
  현대백화점: ["^현대백화점", "^현대그린푸드", "^현대리바트", "^현대홈쇼핑", "^현대IT&E"]
  HL: ["^HL", "^에이치엘"]
  미래에셋: ["^미래에셋"]
  효성: ["^효성"]
  코오롱: ["^코오롱"]
