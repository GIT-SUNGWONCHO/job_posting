# AI 호출 설정. 모델은 여기서만 바꾼다(코드에 쓰지 않는다).
# 무료 등급은 보낸 내용을 구글이 제품 개선에 쓸 수 있다. 공개된 공고만 보내고 이력서 같은 개인정보는 보내지 않는다.

provider: gemini
model: gemini-3.5-flash-lite
min_interval: 4.0      # 호출 사이 최소 간격(초)

job_types:
  batch: 80            # 한 번에 보내는 공고 수
  max_calls: 120       # 하루 최대 호출 수(약 9,600건)
  max_minutes: 15

match_reasons:
  top: 20              # 사람마다 점수 상위 몇 건에 매칭 이유를 쓸지
  batch: 1             # 한 번에 공고 하나. 여러 개를 묶으면 다른 공고의 내용이 섞였다(2026.10.13 시험)
  max_chars: 70        # 매칭 이유 최대 글자 수. 넘으면 버린다
  body_chars: 1200     # 공고 본문을 앞에서 몇 자까지 보낼지
