# 기업 구분 예외: 공적 근거(공공기관 목록·공정위·DART·국민연금)로 정하지 못하거나 틀리게 정해지는 회사를
# 사람이 확인해 정한다. 판정 순서의 맨 앞에서 쓴다(docs/collection.md '기업 구분과 그룹' 예외).
# 회사 키로 적고, type은 구분 이름 그대로, basis는 화면에 "직접 확인: …"으로 보일 근거(출처와 숫자),
# checked는 확인한 날. reason: 예외 이유 코드(config/taxonomy/enums.yaml exception_reasons: EX01 DART 없음 · EX02 DART 틀림 · EX03 기타),
# dart_value: 예외를 만들 때 본 DART 값(없으면 비움). 월간 점검 보고에서 지금 DART 값과 비교한다(docs/taxonomy.md 예외).
overrides:
  당근:
    # DART 법인 "당근마켓"(01547845, daangn.com)에 이었지만 DART API에서 최근 2년 감사보고서가 잡히지 않아 매출이 비었다.
    # 2025년 별도 매출 2,690억 원(연결 2,707억 원), 공정위 지정 그룹 아님, 정보통신업 중소기업 기준 800억 원
    # 출처: 한국경제 2026-03-27 https://www.hankyung.com/article/202603270863g
    type: 중견
    reason: EX01
    dart_value: null
    basis: 2025 별도 매출 2,690억(기준 800억), 한국경제 2026.03.27 보도
    checked: 2026-11-03
  # 업종 예외(2026-11-05, C단계 리뷰): DART 업종 코드가 하는 일과 다른 회사. industry는 업종 중분류 코드,
  # industry_basis는 화면의 "업종 근거: 직접 확인: …". dart_value는 그때 DART 업종 코드.
  빗썸:
    industry: IN0105
    industry_basis: 가상자산 거래소(DART 업종은 통신 판매업)
    reason: EX02
    dart_value: "4791"
    checked: 2026-11-05
  메디트:
    industry: IN0903
    industry_basis: 치과용 3D 구강 스캐너(DART 업종은 기타 전자부품)
    reason: EX02
    dart_value: "26329"
    checked: 2026-11-05
  와이즐리컴퍼니:
    industry: IN0301
    industry_basis: 면도기·생활용품 D2C 브랜드(DART 업종은 금속 날붙이 제조)
    reason: EX02
    dart_value: "25931"
    checked: 2026-11-05
  테슬라:
    industry: IN0401
    industry_basis: 전기차 제조·판매(DART 업종 코드 2599는 다른 금속가공)
    reason: EX02
    dart_value: "2599"
    checked: 2026-11-05
