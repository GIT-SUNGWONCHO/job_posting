# 직무 유형: 직무 분야 "AI·데이터" 안의 좁은 구분과, 그 밖의 직무 분야. 공고 분류, 개인 필터, 매칭, 공고 정리의 업무 꼬리표, 커리어 지표에 쓴다.
# 구조(v2, 2026-11-03): AI·데이터 직무 유형 13개(family: data) + 다른 직무 분야 19개(family: other, id가 f_로 시작).
# 다른 분야는 지인이 오기 전에 분야마다 직무 유형으로 나눈다(기획 문서 정할 것). 분야 목록은 잡코리아 대분류를 뼈대로 했다(docs/decisions.md).
# 고정 목록이고 버전으로 관리한다(docs/content-rules.md "고정 기준은 버전으로").
# 목록이나 설명을 바꾸면 version을 올린다. 다음 수집 때 열린 공고를 모두 다시 분류한다.
# desc는 AI 분류 지시문에 그대로 들어간다.
# short는 좁은 화면(커리어 탭 포지션 맵)에 쓰는 짧은 이름, direction: false는 커리어 방향으로 보지 않는 유형(커리어 탭에서 뺀다).
# 둘은 분류에 쓰지 않아서 바꿔도 version을 올리지 않는다.

version: 2
field: AI·데이터
# 지난 판의 id → 지금 id(마감돼 다시 분류하지 않는 공고를 셀 때)
legacy:
  software: f_sw
  non_data: f_other

types:
  - id: data_eng
    name: 데이터 엔지니어
    short: 데이터 엔지니어
    desc: 데이터 파이프라인·ETL, 데이터 플랫폼, DW·데이터 레이크·레이크하우스, 데이터 인프라 구축·운영, Spark·Kafka·Airflow 같은 데이터 처리 기술 중심 개발
  - id: analytics_eng
    name: 애널리틱스 엔지니어
    short: 애널리틱스 엔지니어
    desc: 분석용 데이터 마트·지표 체계·시맨틱 레이어 구축, dbt·SQL 모델링, BI 대시보드·리포트 개발과 운영(BI 엔지니어)
  - id: data_arch
    name: 데이터 아키텍트·거버넌스
    short: 데이터 아키텍트
    desc: 데이터 아키텍처(DA), 데이터 모델링, 데이터 표준·품질·메타데이터·MDM, 데이터 거버넌스, AI 거버넌스(AI 윤리·리스크·규제 대응)
  - id: dba
    name: DBA·DB 엔지니어
    short: DBA
    desc: 데이터베이스 운영·튜닝·이행, DBA
  - id: analyst
    name: 데이터 분석가
    short: 데이터 분석가
    desc: 사업·그로스·마케팅·서비스 데이터 분석, 지표 분석과 인사이트 도출, 통계 분석. 대시보드는 쓰는 쪽(만드는 일이 주 업무면 애널리틱스 엔지니어)
  - id: data_sci
    name: 데이터 사이언티스트
    short: 데이터 사이언티스트
    desc: 예측·통계 모델링, 실험 설계, 데이터 사이언스
  - id: ml_eng
    name: ML 엔지니어
    short: ML 엔지니어
    desc: 머신러닝·딥러닝 모델 개발(추천·검색·랭킹·컴퓨터 비전·음성·NLP·로봇·자율주행 인지 등)
  - id: mlops
    name: MLOps·AI 플랫폼
    short: MLOps
    desc: 모델 학습·서빙 파이프라인, ML·AI 플랫폼, GPU·AI 인프라
  - id: ai_eng
    name: AI 엔지니어(LLM·에이전트)
    short: AI 엔지니어
    desc: LLM·생성형 AI 응용, RAG, AI 에이전트, AI 서비스 개발, 프롬프트 엔지니어링, FDE
  - id: research
    name: AI 연구
    short: AI 연구
    desc: AI·ML 연구원, 리서치 사이언티스트, 논문·신기술 연구, 교수·연구교수
  - id: planning
    name: AI·데이터 기획·PM
    short: 기획·PM
    desc: AI·데이터 서비스 기획, PM·PO, AX·DX 전략. 조직을 이끄는 자리도 실제 업무가 기획·전략이면 여기(관리 여부는 공고 정리에서 따로 본다)
  - id: consulting
