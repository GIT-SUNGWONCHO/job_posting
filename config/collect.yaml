# 수집 설정 (모두에게 적용, 관리자만 수정)
# 바꾸면 다음 수집부터 적용된다. 이미 저장한 공고는 원본이 있으니 재분류만 하면 된다.

sources:
  zighang:
    enabled: true
    # 직행 직무 대분류 전체를 받는다(AI_데이터 약 7,800건)
    categories: [AI_데이터]
    # 다른 분류에 있는 공고는 제목 검색으로 보강한다. 결과가 제목 일치 순이라
    # 제목에 키워드가 없는 페이지가 나오면 멈춘다.
    title_keywords:
      - 데이터
      - AI
      - 인공지능
      - 머신러닝
      - 딥러닝
      - LLM
      - MLOps
      - 빅데이터
      - BI
      - AX
      - 데이터 아키텍트
      - 데이터 거버넌스
    max_keyword_pages: 10
    # 직행이 붙인 기업 구분으로 회사를 표시한다(분류 전체 + 키워드는 앞 몇 페이지만)
    company_types: [대기업, 공공기관, 외국계]
    max_typed_keyword_pages: 3
    # 하루에 상세(본문)를 받는 최대 건수. 첫날은 다 못 받고 며칠에 걸쳐 채운다
    detail_budget: 1000
    min_interval: 0.4
    max_minutes: 25
    detail_max_minutes: 25

  remember:
    enabled: true
    # 데이터·AI 분류 전체 + 키워드 검색. 받은 뒤 아래 범위 규칙으로 고른다
    # (전체 1만 4천 건을 매일 훑으면 중간에 응답이 멈춘다)
    searches:
      - {job_category_ids: [339, 340, 343, 344, 345, 500]}
      - {keywords: [데이터]}
      - {keywords: [AI]}
      - {keywords: [LLM]}
      - {keywords: [MLOps]}
      - {keywords: [빅데이터]}
      - {keywords: [머신러닝]}
      - {keywords: [BI]}
      - {keywords: [AX]}
      - {keywords: [Data]}
    per: 50  # 한 번에 50건까지만 된다
    max_pages_per_search: 40
    # 1초 간격으로 25번쯤 요청하면 429(요청 과다)가 온다(2026.10). 천천히 받고, 429면 오래 기다린다
    min_interval: 3.0
    backoff: 10
    max_minutes: 15

  saramin:
    enabled: true
    # 본문(상세)은 다른 수집처에 없는 공고만, 하루 최대 이만큼
    detail_budget: 500
    detail_min_interval: 1.0
    detail_max_minutes: 12
    # 사람인 직무 분류 번호(데이터·AI 관련)
    categories:
      82: 데이터분석가
      83: 데이터엔지니어
      106: 데이터마이닝
      107: 데이터시각화
      108: 딥러닝
      109: 머신러닝
      116: 빅데이터
      123: 영상처리
      125: 음성인식
      126: 이미지프로세싱
      131: 챗봇
      133: 컴퓨터비전
      160: NLP(자연어처리)
      161: NLU(자연어이해)
      181: AI(인공지능)
      193: AIX
      856: AI(인공지능)
      1658: 데이터분석
      2246: BI 엔지니어
      2248: 데이터 사이언티스트
    company_types:
      scale001: 대기업
      public: 공기업·공공기관
      foreign: 외국계
    max_pages: 80
    min_interval: 1.0
    max_minutes: 15

  wanted:
    # 꺼 둔다. 2026-10-30 GitHub Actions에서 켜 보니 목록 요청이 전부 403(원티드가 데이터센터 IP를 막는 것으로 보임).
    # 같은 코드가 이 개발 환경에서는 됐다. 정식 경로는 원티드 OpenAPI(채용공고 수집 키, 사업자등록번호 필요).
    # 켜기 전에 잰 영향: 새로 늘어나는 공고 약 300건(+5%), 시장·내 위치는 거의 그대로(docs/decisions.md 2026-10-29)
    enabled: false
    # 원티드 직무 태그 id(개발 518, 경영·비즈니스 507 아래). 이름은 아래 scope.categories에도 있다
    tags:
      655: 데이터 엔지니어
      1025: 빅데이터 엔지니어
      1024: 데이터 사이언티스트
      1634: 머신러닝 엔지니어
      1022: BI 엔지니어
      656: 데이터 분석가
      10231: DBA
    per: 100  # 한 번에 100건까지 된다
    max_pages_per_tag: 30
    min_interval: 1.0
    max_minutes: 10
    # 본문(상세)은 다른 수집처와 묶이지 않은 공고만, 하루 최대 이만큼
    detail_budget: 1000
    detail_min_interval: 1.0
    detail_max_minutes: 25

# 저장 범위: 아래 중 하나에 걸리면 저장한다
scope:
  # 수집처 직무 분류 중 데이터·AI로 보는 것("대분류" 또는 "대분류/소분류")
  # 사람인은 회사가 직무 분류를 넓게 달아서(경영기획 공고에 빅데이터 분류 등) 분류는 믿지 않고
  # 제목 규칙으로만 고른다. 2026.10 확인: 분류 목록 100건 중 제목이 데이터·AI인 공고는 32건
  categories:
    - AI_데이터
    - AI·데이터
    # 원티드 직무 태그(데이터·AI만 골라 받으므로 모두 범위 안)
    - 데이터 엔지니어
    - 빅데이터 엔지니어
    - 데이터 사이언티스트
    - 머신러닝 엔지니어
    - BI 엔지니어
    - 데이터 분석가
    - DBA
  # 제목에 이 중 하나가 들어가면 저장한다(정규식)
  title_include:
    - "데이터"
    - "(?<![A-Za-z])A\\.?I(?![A-Za-z])"
    - "인공지능"
    - "머신\\s*러닝"
    - "딥\\s*러닝"
    - "(?<![A-Za-z])LLM"
    - "MLOps"
    - "빅\\s*데이터"
    - "(?<![A-Za-z])BI(?![A-Za-z])"
    - "(?<![A-Za-z])AX(?![A-Za-z])"
    - "(?i)data"
    - "(?i)machine\\s*learning"
  # 근무지가 이 지역뿐이면 "해외 공고"로 표시한다. 저장은 하지만(지난 공고는 소급할 수 없어서)
  # 국내 목록·분석·추천·상세 받기에서는 뺀다. 직행 데이터·AI 분류의 절반 이상이 해외 공고다
  overseas_regions:
    - 해외
    - 아시아·중동
    - 북·중미
    - 남미
    - 유럽
    - 오세아니아
    - 아프리카
  # 저장은 하되 명백한 잡음으로 표시한다(분석·추천에서 뺀다)
  noise:
    - "데이터\\s*센터"
    - "데이터\\s*입력"
    - "라벨링"
    - "(AI|인공지능|데이터|솔루션).{0,12}영업"
    - "콜\\s*센터"
