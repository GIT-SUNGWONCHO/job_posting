# 수집처마다 다르게 쓰는 회사 이름을 하나로 묶는다(법인명 → 보통 부르는 이름).
# (주), 주식회사 같은 표기는 코드가 알아서 지우므로 여기에는 그 외 차이만 적는다.

aliases:
  삼성생명보험: 삼성생명
  삼성화재해상보험: 삼성화재
  현대해상화재보험: 현대해상
  한화생명보험: 한화생명
  교보생명보험: 교보생명
  비바리퍼블리카: 토스
  엔에이치엔: NHN
  케이티: KT
  에스케이텔레콤: SK텔레콤
  엘지전자: LG전자
  엘지씨엔에스: LG CNS
  네이버클라우드플랫폼: 네이버클라우드
