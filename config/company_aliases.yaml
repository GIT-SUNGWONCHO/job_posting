# 화면 이름만 바꾼다(회사 키에는 쓰지 않는다): DART가 한글 읽기로 적은 그룹 이름 앞부분을 보통 쓰는 영문으로.
# 공고가 없는 주요 기업을 "SK온", "KT&G"로 찾을 수 있게(에스케이온 → SK온). 위에서부터 처음 맞는 것(KT&G가 KT보다 먼저)
display_prefixes:
  에스케이: SK
  엘지: LG
  케이티앤지: KT&G
  케이티: KT
  에이치디씨: HDC
  에이치디: HD
  에이치엘: HL
  엘에스: LS
  엘엑스: LX
  지에스: GS
  씨제이: CJ
  케이비: KB
  케이씨씨: KCC
  디엘: DL
  비씨카드: BC카드
  엔에이치: NH
  아이엠: iM

# 화면 이름만 바꾸는 이름 하나씩(앞부분 규칙으로 안 되는 것). 회사 키에는 쓰지 않는다
display_names:
  삼성에스디에스: 삼성SDS
  삼성에스디아이: 삼성SDI
