# 매칭 지침: AI가 공고마다 비교할 항목을 고르고 가중치·판정을 정하는 기준.
# 처음부터 로직을 정하지 않는다. 회차마다 AI의 판단 근거와 내 피드백을 보고 이 지침을 고치고 version을 올린다.
# version이 바뀌면 다음 매칭 때 후보 공고를 모두 다시 매긴다. 회차 기록은 기획 문서 "매칭 설계" 탭.
# v2(2026-11-02): 평가 20건에서 위쪽 점수가 너무 후했다(90점 이상 11건 중 ○ 1건). 충족을 엄격하게 하고,
# 공고의 직급·영어·고용 형태·업종·회사 규모를 따로 묻고 코드가 원하는 조건에 맞춰 상한·가감점을 준다.
# v3(2026-11-02): 2회차에서 메모 한 줄로 핵심 업무를 미충족 처리해 ○·△ 공고가 너무 내려갔다. 메모는 한 단계만 내리게 하고,
# 영어 상한을 65(고려 구간)로, 회사 규모를 직원 수로 정의했다.
# v4(2026-11-02): 회사 규모는 수집처 표시가 없어 AI 짐작이 회차마다 흔들려서 뺐다(기업 구분 필터는 그대로).
# v5(2026-11-02): 점수는 할 수 있는지(직무 기준)만 본다. 업종 선호·비선호와 '실무자만' 상한은 점수에서 빼고 표시만 한다.
#   직급·수준은 따로 두지 않고 경력 연수와 한 항목(경력 연수·직급)으로 본다.

version: 5

# 항목 종류. AI는 이 중에서 고르고(같은 종류를 여러 번 써도 된다), 맞는 게 없으면 기타
item_kinds: [핵심 업무, 필수 스킬, 우대 스킬, 경력 연수·직급, 도메인·업종, 학력·전공, 자격증, 어학, 기타]

# 판정과 점수 비율. 점수 = 가중치 × 비율의 합(가중치 합이 100이 되게 맞춘 뒤). 코드가 다시 계산한다
fit:
  충족: 1.0
  일부: 0.5
  미충족: 0.0
  정보 없음: 0.5

# 점수 구간과 판정 이름. 판정은 AI가 고르지 않고 최종 점수로 정한다.
# 80점 이상은 지원할 만해야 하고(○), 60~79는 애매(△), 60 미만은 아님(×). 회차 지표도 이 구간으로 잰다
bands:
  지원 추천: 80
  고려: 60
below: 비추천

# 공고에 대해 따로 묻는 것(사람과 상관없는 공고의 사실). 코드가 영어·고용 형태 상한을 걸고, 원하는 조건(직급·업종)은 표시만 한다
posting_facts:
  level: [실무자, 리더·관리자, 주니어, 정보 없음]
  english: [필요, 필요 없음]
  employment: [정규직, 계약직, 인턴, 기타, 정보 없음]

# 점수 상한: 할 수 없는 공고만 그 점수를 넘지 못하게 한다. 취향(원하는 조건)은 점수에 넣지 않는다
gates:
  english_cap: 65      # 영어가 config/profile.yaml english_low인데 영어로 일해야 하는 공고(영어만 부족한 공고는 △로 봤다)
  employment_cap: 30   # 개인 필터의 고용 형태 밖인데 필터에서 못 거른 공고(고용 형태를 안 주는 수집처)

guide: |
  - 공고마다 비교할 항목을 3~8개 고르고, 이 공고에서 중요한 만큼 가중치를 정한다. 가중치 합은 100이다.
  - 핵심 업무가 지원자가 실제로 해 본 일인지를 가장 먼저 본다. 비슷한 이름의 기술보다 실제 한 일이 중요하다.
  - 충족은 지원자 요약에 같은 일을 직접 한 근거가 있을 때만 준다. 비슷하거나 이웃한 경험, 도구 이름만 같은 경우는 일부다.
    예: SQL로 마트를 만든 경험은 코드로 파이프라인을 개발하는 업무의 일부, LLM 챗봇을 만든 경험은 AI 모델·애플리케이션 개발의 일부.
  - 스킬 숙련도를 본다(1 기초, 2 실무, 3 숙련, 4 전문). 공고가 그 스킬로 혼자 설계·개발하기를 요구하는데 숙련도가 2 이하면 충족이 아니다.
  - 코드로 직접 개발하는 일(파이프라인 엔지니어링, 백엔드·애플리케이션, 모델 학습·서빙)이 핵심 업무인데 지원자 요약에 직접 개발한 근거가 없으면 미충족이다.
  - 경력 연수·직급은 한 항목으로 본다. 연수는 총 경력이 아니라 공고가 말하는 그 일의 연수다(지원자 요약의 직무별 경력).
    주니어 공고인데 지원자 연차가 훨씬 높거나, 리드 공고인데 리드 경험이 없으면 미충족이다.
  - 지원자가 이 일을 할 수 있는지만 본다. 업종·회사·직급을 좋아하는지 같은 취향은 판단하지 않는다.
  - 공고에 없는 요건은 항목으로 만들지 않는다. 지원자 쪽 정보가 없으면 '정보 없음'으로 둔다.
  - 우대 사항은 가중치를 작게 둔다.
  - 지원자 요약의 [매칭 메모]는 지원자가 공고를 평가하며 남긴 말에서 뽑은 것으로, 경력에 드러나지 않는 한계를 알려 준다.
    메모에 걸리는 항목은 판정을 한 단계만 내린다(충족 → 일부). 메모 하나만으로 미충족으로 두지 않는다.
  - 공고 사실(posting): level은 이 포지션이 팀장·리더·관리자를 뽑는지(리더·관리자), 실무자인지, 주니어·인턴인지.
    english는 영어로 일하거나(회의·문서·고객) 공고 본문이 대부분 영어면 필요. employment는 고용 형태.
    industry는 회사의 업종(아래 목록의 id). 헤드헌팅 공고는 의뢰 회사 기준.
