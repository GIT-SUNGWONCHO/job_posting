# 프로필에서 고르는 목록. 고르게 해야 AI 판단도 이 안에서 한다(docs/decisions.md 2026-10-14 매칭).
# 업종·숙련도·프로젝트 역할·학력·전공 계열·영어 수준·원하는 직급은 config/taxonomy/(코드 + 이름)에 있다.

# 직무: 내 경력과 관련 있는 직무만 둔다(전체 직무 분류가 아니다). 공고 직무 유형 id와 같은 것은 같은 id,
# 이름이 다른데 공고에서는 한 직무 유형으로 보는 것은 job_type에 적는다(커리어 탭에서 직무별 내 경력을 셀 때).
# code: 그 직무 유형(JT)·분야(JF)의 코드(config/taxonomy/jobs.yaml). 기타(직접 입력)는 코드 없음
roles:
  - {id: data_eng, name: 데이터 엔지니어, code: JT001}
  - {id: data_arch, name: 데이터 아키텍트·거버넌스, code: JT003}
  - {id: bi_eng, name: BI·애널리틱스 엔지니어, job_type: analytics_eng, code: JT002}
  - {id: analyst, name: 데이터 분석가, code: JT005}
  - {id: ai_eng, name: AI 엔지니어(LLM·에이전트), code: JT009}
  - {id: mlops, name: MLOps·AI 플랫폼, code: JT008}
  - {id: planning, name: AI·데이터 기획·PM, code: JT011}
  - {id: pi, name: 업무 프로세스 혁신(PI) 기획, job_type: f_planning, code: JF03}
  - {id: sales_md, name: 영업·MD, job_type: f_sales, code: JF08}
  - {id: other, name: 기타(직접 입력)}

# 원하는 조건(선호·비선호 업종, 원하는 직급)은 표시만 한다(docs/decisions.md 2026-11-02). 선택지는 config/taxonomy/
