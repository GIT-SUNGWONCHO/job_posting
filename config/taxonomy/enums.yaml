# 고정 선택지: 목록마다 2글자 + 2자리 코드. 이름(name)은 지금 데이터·화면·AI 지시문에 그대로 쓰는 값이다.
# 코드는 다시 쓰지 않는다. 이름을 바꾸면 그 이름을 쓰는 곳(공고 정리·매칭 지시문)의 버전을 함께 올린다.
# 임시로 두 벌(2026-11-03): 매칭 공고 사실(PL·PE·PM)은 공고 정리 값(LV·NE+EU·EM)과 겹친다. 공고 정리를 따라잡은 뒤
# 매칭이 공고 정리 값을 바로 쓰게 하고 PL·PE·PM은 은퇴시킨다. 그때까지 대응: PM 기타 ← EM 파견·프리랜서, PL 리더·관리자 ← MG 팀장

