# 업종(IN): 회사가 일하는 시장(도메인) 기준. 대분류(IN + 2자리) · 중분류(IN + 대분류 2 + 2자리).
# 판정에 상위를 쓴다(같은 중분류 충족, 같은 대분류 일부). 규칙은 docs/taxonomy.md '업종'.
# 2026-11-04 확정(B): KSIC 11차 대조와 공고 회사의 DART 업종 분포로 만들었다. KSIC는 법정 사업이라 IT 회사는
# 하는 일과 상관없이 58·62·63으로 몰려서, 업종은 시장 기준으로 잡고 KSIC는 근거의 하나로 쓴다.
# legacy: 저장된 지난 id(코드로 옮기기 전까지 읽고 쓴다). 지난 23개는 아래 legacy가 같은 항목으로 이어진다.
# ksic: 이 업종으로 바로 정해도 되는 KSIC 코드 앞자리(DART induty_code가 이것으로 시작하면). 긴 쪽이 먼저.
#   DART 코드가 앞자리보다 짧아 여러 업종에 걸치면(예: 649 → 기타 금융과 지주회사) 정하지 않고 generic으로 본다.
# words: 업종 경험 문장에서 이 업종으로 볼 말(맞출 사전, 긴 말부터). 이름과 따로 둔다. 끝에 *가 붙은 말은 뜻이 넓어서
#   바로 뒤에 산업·업계·업권·업·도메인·분야·기업·회사·사·펌·서비스·프로젝트·플랫폼이 붙을 때만 센다(예: '보안 업계').
#   대분류(groups)의 words는 넓은 말(금융, 제조): 그 아래 아무 경력이나 충족. 놓친 문장은 월간 점검에 올라온다.
# ksic_generic: 도메인을 알려 주지 않는 KSIC 앞자리. 이 코드면 공고 정리의 회사 도메인(AI)으로 정한다.
# 바꾸면 version을 올린다(공고 정리가 업종 경험·회사 도메인을 이 목록으로 적어서 다시 뽑는다).

version: 2

