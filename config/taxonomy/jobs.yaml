# 직무 분야(JF)와 직무 유형(JT). 코드 규칙은 docs/taxonomy.md. 코드는 다시 쓰지 않고 번호도 다시 매기지 않는다.
# 이름·설명은 고쳐도 된다. 설명(desc)은 AI 분류 지시문에 들어가므로 바꾸면 version을 올린다(열린 공고를 다시 분류).
# legacy: 데이터에 저장된 지난 id(코드로 옮기기 전까지 이 id로 읽고 쓴다). 갈라지면 retired와 replaced_by를 남긴다.
# 직무 유형은 분야를 옮길 수 있어 코드에 분야를 넣지 않고 field 칸에 적는다.

version: 3  # 3: 데이터 분석가 설명을 넓힘
# 지난 판 id → 지금 id(마감돼 다시 분류하지 않는 공고를 셀 때)
