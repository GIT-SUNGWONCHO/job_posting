# 판정에 쓰는 관계: aliases(같은 스킬), interchangeable(IS, 서로 충족), broader(넓은 개념: 공고가 넓은 개념이면 좁은 쪽이 충족, 반대는 일부).
# aliases는 본문에서 찾는 표기: 영문은 단어 경계, 3글자 이하 영문은 대소문자까지 맞아야 한다. 한글은 그대로.
