# 회사 기본정보(DART). 공고가 들어온 회사를 DART 고유번호와 잇고 기업개황·주요 재무·직원 현황·주요 공시를 모은다.
# 코드는 src/jobpost/dart.py, 기준과 이유는 docs/content-rules.md "회사 리서치 모듈"과 docs/decisions.md.
# 키는 GitHub Secrets DART_API_KEY로만 받는다.

# 요청 수: DART는 키 하나에 하루 2만 건. 매일 수집 뒤 budget만큼만 쓰고 남은 회사는 다음 날 이어서 받는다.
# 처음 한꺼번에 모을 때는 Actions > dart를 budget을 크게 넣어 돌린다.
budget: 800
interval: 0.2          # 요청 사이 쉬는 초(분당 300건 안쪽. 분당 1,000건 넘으면 IP가 1시간 막힌다)

refresh_days: 30       # 받은 지 이만큼 지난 회사는 다시 받는다(새 사업보고서·공시 반영)
retry_unmatched_days: 30  # 못 찾은 회사를 다시 찾아보는 간격(DART 회사 목록이 바뀌므로)

# 최근 주요 공시: 이 기간 안의 주요사항보고(B)와 거래소공시(I)에서 보여줄 것만
disclosure_days: 365
disclosure_types: [B, I]
disclosure_max: 8
# 공시 이름에 이 말이 들어가면 주요 공시로 보지 않는다(정기적이거나 회사 이해에 덜 중요한 것)
disclosure_skip:
  - 기업설명회
  - 공정공시
  - 주주총회소집
  - 결산실적공시예고
  - 매출액또는손익구조
  - 영업(잠정)실적
  - 연결재무제표기준영업(잠정)실적
  - 자기주식
  - 기타경영사항
  - 풍문또는보도
  - 조회공시
  - 최대주주등소유주식변동
  - 현금ㆍ현물배당
  - 주식등의대량보유
  - 임원ㆍ주요주주
  - 첨부정정
  - 기재정정

# 회사 키(공고 회사 이름을 정리한 것) → DART 고유번호(8자리). 이름이 달라 못 찾았거나 잘못 이은 회사를 손으로 잇는다.
# null이면 잇지 않는다. 회사 키는 대시보드 회사 주소(#/company/<키>)에 보이는 값이다.
overrides: {}
