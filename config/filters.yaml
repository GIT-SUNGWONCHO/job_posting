# 개인 필터(1차 필터). 저장된 공고는 그대로 두고 보는 목록에서만 거른다.
# 비용이 들지 않아서 바꾸면 지난 공고에도 바로 적용된다.
# 이 파일은 처음 기본값이다. 화면에서 고친 값은 계정(Supabase settings 표)에 저장된다.
# 필터를 통과한 공고가 AI 매칭·공고 정리의 후보가 된다(통과 못 한 공고에는 AI를 쓰지 않는다).

exclude_keywords:
  - 데이터센터 설비
  - 데이터 입력
  - AI 솔루션 영업

# 회사 이름에 들어가면 항상 보여준다 / 보여주지 않는다
always_companies: []
exclude_companies: []

# 보여줄 직무 유형(config/taxonomy/jobs.yaml의 legacy id, 코드로 옮기기 전). 아직 분류 안 된 공고는 통과
job_types:
  - data_eng
  - data_arch
  - mlops
  - ai_eng
  - analyst
  - analytics_eng

# 보여줄 기업 구분(공기업·공공기관, 대기업, 외국계, 중견, 중소·스타트업, 확인 안 됨)
# 비우면 전부(헤드헌팅 공고의 의뢰 회사 구분을 모르는 '그 외'도). 2026-11-03 사용자: 스타트업까지 다 본다
company_types: []

# 공고의 경력 범위가 이 범위와 겹치면 보여준다. 연차 무관 공고는 통과
career:
  min: 7
  max: 15

# 보여줄 고용 형태. 수집처가 고용 형태를 주지 않는 공고(리멤버)는 통과. 여럿이 붙은 공고는 하나라도 맞으면 통과
employment_types:
  - 정규직

# 근무 지역(시·도). 원격은 지역과 상관없이 통과
regions:
  - 서울
  - 경기
  - 원격
