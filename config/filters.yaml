# 개인 필터(1차 필터). 저장된 공고는 그대로 두고 보는 목록에서만 거른다.
# 비용이 들지 않아서 바꾸면 지난 공고에도 바로 적용된다.
# 이 파일은 처음 기본값이다. 화면에서 고친 값은 계정(Supabase settings 표)에 저장된다.

exclude_keywords:
  - 데이터센터 설비
  - 데이터 입력
  - AI 솔루션 영업

# 회사 이름에 들어가면 항상 보여준다 / 보여주지 않는다
always_companies: []
exclude_companies: []

# 보여줄 직무 유형(config/job_types.yaml의 id). 아직 분류 안 된 공고는 통과
job_types:
  - data_eng
  - data_arch
  - mlops
  - ai_eng
  - analyst

# 보여줄 기업 구분(대기업, 공기업·공공기관, 외국계, 그 외)
company_types:
  - 대기업
  - 공기업·공공기관
  - 외국계

# 공고의 경력 범위가 이 범위와 겹치면 보여준다. 연차 무관 공고는 통과
career:
  min: 7
  max: 15

# 근무 지역(시·도). 원격은 지역과 상관없이 통과
regions:
  - 서울
  - 경기
  - 원격
